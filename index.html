<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Vietnam Climate Scenario Explorer · Kịch bản khí hậu Việt Nam</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="description" content="Việt Nam sẽ nóng và mưa nhiều thêm bao nhiêu vào năm 2100? Năm mô hình khí hậu CMIP6 theo hai kịch bản phát thải, kèm công cụ tự khám phá. How much warmer and wetter will Vietnam get by 2100? Five CMIP6 models under two emissions scenarios.">
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e1e1c" media="(prefers-color-scheme: dark)">
    <script>
        /* apply the reader's saved light/dark choice before the page paints */
        try { var th = localStorage.getItem('theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body>
    <a class="skip" href="#explore" data-i18n="skip"></a>

    <header class="folio">
        <div class="folio-in">
            <span class="sec-block" data-i18n="section"></span>
            <a class="nameplate" href="#top" data-i18n="nameplate"></a>
            <div class="folio-ctl">
                <div class="lang" id="langSeg" role="group" data-i18n-attr="aria-label:langLabel">
                    <button type="button" data-lang="vi" lang="vi" aria-pressed="true">VI</button>
                    <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
                </div>
                <div class="lang theme" id="themeSeg" role="group" data-i18n-attr="aria-label:themeLabel">
                    <button type="button" data-theme="light" aria-pressed="false" data-i18n-attr="aria-label:themeLight">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
                    </button>
                    <button type="button" data-theme="dark" aria-pressed="false" data-i18n-attr="aria-label:themeDark">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>
                    </button>
                </div>
            </div>
            <a class="data-badge" id="dataBadge" href="#about"></a>
        </div>
    </header>

    <nav class="chapters" data-i18n-attr="aria-label:navLabel">
        <p class="rail-head" data-i18n="navLabel"></p>
        <ul>
            <li class="rail-act" aria-hidden="true" data-i18n="actAnd"></li>
            <li><a href="#ch-models" data-i18n="navModels"></a></li>
            <li><a href="#ch-change" data-i18n="navChange"></a></li>
            <li><a href="#ch-futures" data-i18n="navFutures"></a></li>
            <li><a href="#ch-rain" data-i18n="navRain"></a></li>
            <li class="rail-act" aria-hidden="true" data-i18n="actBut"></li>
            <li><a href="#ch-fork" data-i18n="navFork"></a></li>
            <li><a href="#ch-regions" data-i18n="navRegions"></a></li>
            <li class="rail-act" aria-hidden="true" data-i18n="actThen"></li>
            <li><a href="#ch-close" data-i18n="navClose"></a></li>
            <li><a href="#explore" data-i18n="navExplore"></a></li>
        </ul>
        <p class="rail-other"><span class="rail-kicker" data-i18n="navHanoiKicker"></span><a href="hanoi.html" data-i18n="navHanoi"></a></p>
    </nav>

    <main id="top">
        <article class="lead" aria-labelledby="heroTitle">
            <div class="wrap">
                <h1 id="heroTitle"></h1>
                <p class="sapo" data-i18n="sapo"></p>

                <div class="lead-grid">
                    <figure class="lead-fig">
                        <div class="stripes" role="img" id="stripesFig">
                            <div class="stripes-band">
                                <svg id="stripes" viewBox="0 0 151 2" preserveAspectRatio="none" aria-hidden="true" focusable="false"></svg>
                                <div class="stripes-labels" aria-hidden="true">
                                    <span><b>SSP2-4.5</b> <span class="long" data-i18n="medShort"></span></span>
                                    <span><b>SSP5-8.5</b> <span class="long" data-i18n="highShort"></span></span>
                                </div>
                            </div>
                            <div class="stripes-axis" aria-hidden="true">
                                <span class="t0">1950</span>
                                <span class="t1">2015</span>
                                <span class="t2">2100</span>
                            </div>
                        </div>
                        <figcaption class="cap" id="stripesCap"></figcaption>
                        <div class="key" id="stripesKey" aria-hidden="true"></div>
                    </figure>

                    <div class="lead-col">
                        <p class="byline" id="byline"></p>
                        <p id="leadP1"></p>
                    </div>

                    <div class="lead-col">
                        <p data-i18n="leadP2"></p>
                        <div class="pull" id="pull"></div>
                        <p class="jump"><a href="#ch-models" data-i18n="jumpStory"></a> <span class="pg" data-i18n="jumpStoryPg"></span></p>
                        <p class="jump"><a href="#explore" data-i18n="jumpExplore"></a> <span class="pg" data-i18n="jumpExplorePg"></span></p>
                        <p class="jump"><a href="hanoi.html" data-i18n="jumpHanoi"></a> <span class="pg" data-i18n="jumpHanoiPg"></span></p>
                    </div>
                </div>
            </div>
        </article>

        <section class="story" id="story" data-i18n-attr="aria-label:storyLabel">
            <div class="story-graphic">
                <div class="story-frame">
                    <div id="storyChart" class="story-chart" role="img"></div>
                    <div id="storyMapWrap" class="story-map" hidden>
                        <div class="map-head">
                            <span class="map-title" id="storyMapTitle"></span>
                            <div class="seg seg-sm" id="mapScen" role="group" data-i18n-attr="aria-label:ctlScenarios">
                                <button type="button" data-s="ssp245" aria-pressed="false">SSP2-4.5</button>
                                <button type="button" data-s="ssp585" aria-pressed="true">SSP5-8.5</button>
                            </div>
                        </div>
                        <div id="storyMap" class="map-svg" role="img"></div>
                    </div>
                    <div class="story-legend" id="storyLegend" aria-hidden="true"></div>
                    <p class="story-source" id="storySource"></p>
                </div>
            </div>

            <div class="story-steps">
                <article class="step" data-step="tas-abs" id="ch-models"><div class="step-body" data-text="tas-abs"></div></article>
                <article class="step" data-step="tas-anom" id="ch-change"><div class="step-body" data-text="tas-anom"></div></article>
                <article class="step" data-step="tas-245" id="ch-futures"><div class="step-body" data-text="tas-245"></div></article>
                <article class="step" data-step="tas-585"><div class="step-body" data-text="tas-585"></div></article>
                <article class="step" data-step="pr-abs" id="ch-rain"><div class="step-body" data-text="pr-abs"></div></article>
                <article class="step" data-step="pr-agree"><div class="step-body" data-text="pr-agree"></div></article>
                <article class="step" data-step="pr-hatch"><div class="step-body" data-text="pr-hatch"></div></article>
                <article class="step" data-step="tas-fork" id="ch-fork"><div class="step-body" data-text="tas-fork"></div></article>
                <article class="step" data-step="map-zones" id="ch-regions"><div class="step-body" data-text="map-zones"></div></article>
                <article class="step" data-step="map-grid"><div class="step-body" data-text="map-grid"></div></article>
                <article class="step" data-step="map-2023"><div class="step-body" data-text="map-2023"></div></article>
                <article class="step" data-step="close" id="ch-close"><div class="step-body" data-text="close"></div></article>
            </div>
        </section>

        <section class="explore" id="explore" aria-labelledby="exploreTitle">
            <div class="wrap">
                <div class="explore-head">
                    <h2 id="exploreTitle" data-i18n="exploreTitle"></h2>
                    <p data-i18n="exploreIntro"></p>
                </div>

                <div class="explore-grid">
                    <div class="explore-main">
                        <div class="chart-head">
                            <h3 id="ctitle"></h3>
                            <p id="csub"></p>
                        </div>
                        <div id="chart" tabindex="0" role="group" aria-roledescription="chart" aria-describedby="chartHelp">
                            <div id="tip" role="tooltip" aria-hidden="true"></div>
                        </div>
                        <div id="legend" class="legend"></div>
                        <p class="chart-help" id="chartHelp" data-i18n-html="chartHelp"></p>
                        <div id="chartLiveAnnounce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

                        <section class="results" aria-labelledby="statsHeading">
                            <h3 id="statsHeading"></h3>
                            <div id="stats" aria-live="polite"></div>
                        </section>

                        <details class="disclosure" id="tableDetails">
                            <summary data-i18n="tableSummary"></summary>
                            <div id="accessibleTable" class="data-table-wrap"></div>
                        </details>
                    </div>

                    <aside class="rail" data-i18n-attr="aria-label:railLabel">
                        <fieldset class="ctl" id="regionCtl">
                            <legend><label for="region" data-i18n="ctlRegion"></label></legend>
                            <select id="region" class="select"></select>
                            <div id="exMap" class="ex-map" aria-hidden="true"></div>
                            <div class="key ex-key" id="exMapKey" aria-hidden="true"></div>
                            <p class="ctl-note" id="regionNote"></p>
                        </fieldset>

                        <fieldset class="ctl">
                            <legend data-i18n="ctlVariable"></legend>
                            <div class="seg" id="varSeg" role="group" data-i18n-attr="aria-label:ctlVariable">
                                <button type="button" data-v="tas" aria-pressed="true" data-i18n="varTas"></button>
                                <button type="button" data-v="pr" aria-pressed="false" data-i18n="varPr"></button>
                            </div>
                        </fieldset>

                        <fieldset class="ctl">
                            <legend data-i18n="ctlValues"></legend>
                            <div class="seg" id="modeSeg" role="group" data-i18n-attr="aria-label:ctlValues">
                                <button type="button" data-m="anom" aria-pressed="true" data-i18n="modeAnom"></button>
                                <button type="button" data-m="abs" aria-pressed="false" data-i18n="modeAbs"></button>
                            </div>
                            <label class="range-label" for="base"><span data-i18n="ctlBaseline"></span> <b id="blabel">1985–2014</b></label>
                            <input type="range" id="base" min="1950" max="1985" step="1" value="1985">
                            <p class="ctl-note" data-i18n="baselineNote"></p>
                        </fieldset>

                        <fieldset class="ctl">
                            <legend data-i18n="ctlScenarios"></legend>
                            <div class="checks" id="scens">
                                <label class="check"><input type="checkbox" value="ssp245" checked><span class="sw" style="--c:var(--s245)" aria-hidden="true"></span><span>SSP2-4.5 <span class="muted" data-i18n="medShort"></span></span></label>
                                <label class="check"><input type="checkbox" value="ssp585" checked><span class="sw" style="--c:var(--s585)" aria-hidden="true"></span><span>SSP5-8.5 <span class="muted" data-i18n="highShort"></span></span></label>
                            </div>
                        </fieldset>

                        <fieldset class="ctl">
                            <legend><span data-i18n="ctlModels"></span> <span class="muted" id="modelCount"></span></legend>
                            <div class="checks" id="models"></div>
                            <p class="ctl-note" id="modelHint" aria-live="polite"></p>
                            <button type="button" class="link-btn" id="allModels" data-i18n="allModels"></button>
                        </fieldset>

                        <fieldset class="ctl">
                            <legend data-i18n="ctlDisplay"></legend>
                            <div class="checks">
                                <label class="check"><input type="checkbox" id="ind"><span data-i18n="showEach"></span></label>
                                <label class="check"><input type="checkbox" id="smooth" checked><span data-i18n="smooth10"></span></label>
                            </div>
                        </fieldset>

                        <fieldset class="ctl">
                            <legend data-i18n="ctlData"></legend>
                            <div class="seg" id="srcSeg" role="group" data-i18n-attr="aria-label:ctlData">
                                <button type="button" data-s="real" id="realBtn" aria-pressed="false" data-i18n="srcReal"></button>
                                <button type="button" data-s="sample" aria-pressed="false" data-i18n="srcSample"></button>
                            </div>
                            <p class="ctl-note" id="dataMsg" role="status"></p>
                            <div class="ctl-links">
                                <label class="link-btn file"><span data-i18n="loadJson"></span><input type="file" id="file" accept=".json,application/json"></label>
                                <button type="button" class="link-btn" id="dlSample" data-i18n="dlExample"></button>
                                <button type="button" class="link-btn" id="resetBtn" hidden></button>
                            </div>
                        </fieldset>
                    </aside>
                </div>
            </div>
        </section>

        <section class="about" id="about" aria-labelledby="aboutTitle">
            <div class="wrap about-grid">
                <div class="about-col">
                    <h2 id="aboutTitle" data-i18n="aboutTitle"></h2>
                    <p id="aboutData" data-i18n-html="aboutData"></p>
                    <p data-i18n="aboutRuns"></p>
                    <details class="disclosure">
                        <summary data-i18n="ownTitle"></summary>
                        <p data-i18n-html="ownText"></p>
<pre><code>import json
out = {"tas": {}, "pr": {}}
# for every variable v, model m and scenario s:
out[v].setdefault(m, {})[s] = [float(x) for x in annual_values]   # s: historical, ssp245, ssp585
json.dump(out, open("vietnam_cmip6.json", "w"))</code></pre>
                    </details>
                </div>
                <dl class="glossary">
                    <dt>CMIP6</dt>
                    <dd data-i18n="gCmip"></dd>
                    <dt>SSP2-4.5 · SSP5-8.5</dt>
                    <dd data-i18n="gSsp"></dd>
                    <dt data-i18n="gBaseT"></dt>
                    <dd data-i18n="gBase"></dd>
                    <dt data-i18n="gEnsT"></dt>
                    <dd data-i18n="gEns"></dd>
                    <dt data-i18n="gSmoothT"></dt>
                    <dd data-i18n="gSmooth"></dd>
                </dl>
            </div>
        </section>
    </main>

    <footer class="imprint">
        <div class="wrap">
            <p data-i18n="imprint"></p>
        </div>
    </footer>

    <!-- plain scripts that share top-level names; order matters, scripts/main.js starts the page -->
    <script src="scripts/util.js"></script>
    <script src="scripts/i18n.js"></script>
    <script src="scripts/data.js"></script>
    <script src="scripts/copy.js"></script>
    <script src="scripts/stripes.js"></script>
    <script src="scripts/regions.js"></script>
    <script src="scripts/zone-map.js"></script>
    <script src="scripts/story-chart.js"></script>
    <script src="scripts/explorer.js"></script>
    <script src="scripts/explorer-controls.js"></script>
    <script src="scripts/story.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
